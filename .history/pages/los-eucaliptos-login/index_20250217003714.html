<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Eucaliptos</title>
    <link rel="icon" href="/assets/ícono-los-eucaliptos.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>

</head>
<body>
    <header>
        <div class="logo">
            <img src="/assets/logo-los-eucaliptos.png" alt="Los Eucaliptos Logo">
        </div>
    </header>

<form id="loginForm">
    <label for="loginUsername">Usuario:</label>

    <button type="submit">Iniciar sesión</button>
</form>


</body>
