<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Eucaliptos</title>
    <link rel="icon" href="/assets/ícono-los-eucaliptos.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script> <!-- Se recomienda 'defer' para evitar bloqueos -->

</head>
<body>
    <header>
        <div class="logo">
            <img src="/assets/logo-los-eucaliptos.png" alt="Los Eucaliptos Logo">
        </div>
    </header>
    <center><h2>Registro</h2></center> 
  <div class="container-register">
    <div class="register-box">

    </div>
    <form id="registroForm">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" required>

        <label for="celular">Número de celular:</label>
        <input type="text" id="celular" required>

        <label for="username">Usuario:</label>
        <input type="text" id="username" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" required>

        <button type="submit">Registrar</button>
    </form>
</div>

</body>
</html>
