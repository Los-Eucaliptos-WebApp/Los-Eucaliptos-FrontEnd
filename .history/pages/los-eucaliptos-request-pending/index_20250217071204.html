<!DOCTYPE html>
<html>
<head>
    <title>Requerimientos Pendientes</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Requerimientos Pendientes</h1>
        <div class="search-box">
            <input type="text" placeholder="Buscar por ID o solicitante">
            <button>Buscar</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Solicitante</th>
                    <th>Estado</th>
                    <th>Creación</th>
                    <th>Días</th>
                    <th>VB1</th>
                    <th>VB2</th>
                    <th>VB3</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>0001</td>
                    <td>Nombre Apellido</td>
                    <td>En espera</td>
                    <td>DD/MM/AA</td>
                    <td>03</td>
                    <td>Firmado</td>
                    <td>En revisión</td>
                    <td>En revisión</td>
                </tr>
                </tbody>
        </table>
        <div class="pagination">
            <button>Anterior</button>
            <span>1</span>
            <button>Siguiente</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
