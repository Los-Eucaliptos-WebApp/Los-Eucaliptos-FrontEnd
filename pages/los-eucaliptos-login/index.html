<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Eucaliptos</title>
    <link rel="icon" href="/assets/ícono-los-eucaliptos.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>

</head>
<body>
    <header>
        <div class="logo">
            <img src="/assets/logo-los-eucaliptos.png" alt="Los Eucaliptos Logo">
        </div>
    </header>

<div class="content-container">
    <div class="left-side">
        <img src="/assets/login.png" alt="Imagen" class="content-image">
    </div>
    <div class="right-side">
        <form action="#" method="post" class="form-container">
            <h2>Iniciar Sesión</h2>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" class="submit-btn">Iniciar sesión</button>
        </form>
    </div>
</div>

</body>
</html>
